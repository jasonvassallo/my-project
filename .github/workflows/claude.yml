name: Claude Code

# @claude MENTION assistant ONLY -- this workflow does NOT auto-review PRs.
# Automatic Claude review is handled solely by claude-code-review.yml (the
# `claude-review` check), so Claude reviews each PR exactly once (this file
# previously also carried the `pull_request` auto-review trigger, as a second
# job in the same file).
# It responds only when someone writes "@claude" in an issue, a PR/issue
# comment, or a PR review comment.
#
# This is the credential-bearing path: it holds `contents: write` so @claude
# can push a fix or open a branch. Everything below exists to keep that
# capability reachable only by a trusted actor, on non-fork content.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only trusted actors (OWNER/MEMBER/COLLABORATOR) can invoke @claude, so an
    # untrusted account can never start this credential-bearing job. That gate
    # is also what makes the `issues` trigger safe on this public repo: without
    # it, stranger-authored issue bodies would flow straight into an agentic
    # run. PR review comments additionally require the PR head to live in this
    # repo -- that payload carries head-repo, so the fork guard is declarative
    # there; the issue_comment path resolves the same guard via the API in the
    # first step below.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # @claude may be asked to push a fix/branch
      pull-requests: write
      issues: write
      id-token: write # required by claude-code-action to fetch its OIDC token
      actions: read
    steps:
      # issue_comment payloads carry no PR-head-repo field, so the fork guard
      # is resolved via the API instead. Runs BEFORE checkout so a fork PR's
      # content is never fetched while this job's token is on disk; failing the
      # job is fail-closed. The commenter gate does not cover this on its own
      # -- a maintainer can be lured into tagging a malicious fork PR.
      - name: Fail closed on fork PRs
        if: ${{ github.event.issue.pull_request }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
        run: |
          head_repo="$(gh api "$PR_URL" --jq '.head.repo.full_name')"
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "PR head is from fork '$head_repo' — refusing to run @claude with credentials." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # claude-code-action's setupBranch runs a plain `git fetch origin` of
          # the PR branch BEFORE it configures its own git auth, so it depends
          # on the credentials actions/checkout persists in .git/config. With
          # persist-credentials: false that fetch dies ("could not read
          # Username for 'https://github.com'") and every run fails. The
          # persisted token is this job's GITHUB_TOKEN (contents: write, so
          # @claude can push a fix/branch), scoped to the job's lifetime.
          persist-credentials: true
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@700e7f8316990de46bed556429765647af760efc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # API-based commit signing keeps the exchanged app token out of the
          # workspace: without it, tag mode writes the token into the origin
          # remote URL or a helper script, both readable from inside the run.
          use_commit_signing: true
          additional_permissions: |
            actions: read
